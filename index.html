<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>XVV Privacy · +18</title>
  <meta name="description" content="XVV Privacy — Seu acesso exclusivo começa aqui. Conteúdo +18.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d0306">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0d0306;            /* vinho quase preto */
      --card: #1a070d;          /* vinho escuro do card */
      --card-border: #3a1220;   /* borda vinho sutil */
      --pink: #ff63b6;
      --pink-neon: #ff2d95;
      --purple: #9b30ff;
      --orange: #ff7a1a;
      --text: #ffffff;
      --muted: #c9a3b4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255, 45, 149, 0.10) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(155, 48, 255, 0.08) 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- CARD ---------- */
    .card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #1d0810 0%, var(--card) 100%);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: 32px 24px 26px;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(255, 99, 182, 0.04) inset,
        0 20px 60px rgba(0, 0, 0, 0.6),
        0 0 80px rgba(255, 45, 149, 0.08);
      animation: fadeUp .6s ease-out both;
    }

    /* ---------- AVISO +18 ---------- */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 122, 26, 0.65);
      background: rgba(255, 122, 26, 0.12);
      color: var(--orange);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      box-shadow: 0 0 14px rgba(255, 122, 26, 0.45), inset 0 0 10px rgba(255, 122, 26, 0.15);
      text-shadow: 0 0 8px rgba(255, 122, 26, 0.6);
    }

    /* ---------- FOTO ---------- */
    .avatar-wrap {
      width: min(240px, 64vw);
      height: min(240px, 64vw);
      margin: 26px auto 20px;
      padding: 4px;
      border-radius: 50%;
      background: conic-gradient(from 200deg, var(--pink-neon), var(--orange), var(--purple), var(--pink-neon));
      box-shadow: 0 0 24px rgba(255, 45, 149, 0.55), 0 0 48px rgba(155, 48, 255, 0.25);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid var(--card);
      object-fit: cover;
      display: block;
      background: linear-gradient(135deg, #3a1220, #1a070d);
    }

    /* ---------- NOME ---------- */
    .name {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: clamp(32px, 9vw, 40px);
      line-height: 1.1;
      color: var(--pink);
      letter-spacing: -0.5px;
      text-shadow: 0 0 18px rgba(255, 99, 182, 0.55), 0 0 36px rgba(255, 45, 149, 0.25);
    }

    /* ---------- FRASE ---------- */
    .tagline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 99, 182, 0.25);
      background: rgba(255, 99, 182, 0.06);
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    /* ---------- CTA ---------- */
    .cta {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      margin-top: 30px;
      padding: 19px 24px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--pink-neon) 0%, #d93cd0 50%, var(--purple) 100%);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .6px;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 0 22px rgba(255, 45, 149, 0.55), 0 8px 30px rgba(155, 48, 255, 0.35);
      transition: transform .25s ease, box-shadow .25s ease;
      animation: pulse 2s ease-in-out infinite;
      touch-action: manipulation;
      min-height: 60px;
    }

    .cta .arrow {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      transition: transform .25s ease;
    }

    .cta:hover,
    .cta:focus-visible {
      transform: scale(1.04);
      animation-play-state: paused;
      box-shadow: 0 0 34px rgba(255, 45, 149, 0.8), 0 10px 40px rgba(155, 48, 255, 0.5);
      outline: none;
    }

    .cta:hover .arrow { transform: translateX(4px); }
    .cta:active { transform: scale(0.98); }

    /* ---------- RODAPÉ ---------- */
    .footer {
      margin-top: 26px;
      font-size: 12px;
      color: rgba(201, 163, 180, 0.55);
    }

    /* ---------- ANIMAÇÕES ---------- */
    @keyframes pulse {
      0%, 100% { transform: scale(1);    box-shadow: 0 0 22px rgba(255, 45, 149, 0.55), 0 8px 30px rgba(155, 48, 255, 0.35); }
      50%      { transform: scale(1.025); box-shadow: 0 0 36px rgba(255, 45, 149, 0.85), 0 8px 40px rgba(155, 48, 255, 0.5); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cta, .card { animation: none; }
    }

    @media (max-width: 360px) {
      .card { padding: 26px 18px 22px; border-radius: 28px; }
      .avatar-wrap { width: 200px; height: 200px; }
      .cta { font-size: 15px; padding: 17px 18px; }
    }
  </style>
</head>
